services:
  postgres:
    image: postgres:16-alpine
    container_name: sutra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sutra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sutra_password}
      POSTGRES_DB: ${POSTGRES_DB:-sutra_db}
    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - sutra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sutra_user} -d ${POSTGRES_DB:-sutra_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  sutra_postgres_data:
