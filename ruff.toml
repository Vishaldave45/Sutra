line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (standard for FastAPI Depends/Query)
]

[lint.isort]
known-first-party = ["apps"]

